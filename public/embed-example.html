<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>무한생 iframe 검증</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #ece9e2; color: #222; }
    main { max-width: 960px; margin: auto; padding: 20px 12px; }
    h1 { font-size: 1.4rem; } p { line-height: 1.6; }
    label { display: block; padding: 16px 0; } input { width: 20px; height: 20px; vertical-align: middle; }
    iframe { display: block; width: 100%; height: 900px; border: 0; border-radius: 8px; }
  </style>
</head>
<body>
<main>
  <h1>무한생 iframe 검증</h1>
  <p>수신 코드가 없는 기본 높이와, 메시지를 받아 높이를 맞추는 동작을 비교합니다.</p>
  <label><input id="sync" type="checkbox" /> 높이 자동 맞춤 사용</label>
  <p id="status" role="status">기본 높이 900px · iframe 내부 스크롤</p>
  <iframe id="life-game" title="무한생 선택형 인생 게임" src="./" height="900" loading="eager"></iframe>
  <p>게임 아래의 부모 페이지 본문입니다. 높이 동기화 시 이 문장이 게임 화면 바로 뒤에 표시됩니다.</p>
</main>
<script type="module">
  import { attachLifeFrame } from './life-embed.js';
  const frame = document.querySelector('#life-game');
  const status = document.querySelector('#status');
  let detach = null;
  document.querySelector('#sync').addEventListener('change', event => {
    detach?.(); detach = null;
    if (event.target.checked) detach = attachLifeFrame(frame, height => { status.textContent = `높이 동기화 중 · ${height}px`; });
    else { frame.style.height = '900px'; status.textContent = '기본 높이 900px · iframe 내부 스크롤'; }
  });
</script>
</body>
</html>
